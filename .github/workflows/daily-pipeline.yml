name: Daily Pipeline

on:
  schedule:
    - cron: '43 4 * * *'    # 04:43 UTC (4 AM UTC is past the midnight-UTC pile-up and past the 2–3 AM band and :43 is a non-round minute to avoid both the top-of-hour spike and the half-hour mark, which also sees elevated load.)
  workflow_dispatch:        # Allow manual trigger

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Crawl repositories
        run: npm run crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CRAWL_MAX_DURATION_MS: 1200000  # 20 minutes (in milliseconds)

      - name: Refresh dormant repositories
        run: npm run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Aggregate pairings
        run: npm run aggregate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate snapshots
        run: npm run snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Compute trends
        run: npm run trends
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Export datasets
        run: npm run export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Validate exports
        run: npm run validate-exports

      - name: Monitor 30-day integrity
        run: npm run monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Update README summary
        run: npm run update-readme

      - name: Generate network graph
        run: npm run generate-network

      - name: Commit datasets
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update datasets [skip ci]'
          file_pattern: 'public/datasets/*.json README.md'

      - name: Notify failure on GitHub issues
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Daily Pipeline Failed (${new Date().toISOString().split('T')[0]})`;
            const body = `The scheduled daily pipeline failed.\n\nCheck the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'pipeline']
            });
